<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Akıllı Kredi Risk Analizi</title>
</head>
<body>
    <h1>Akıllı Kredi Risk Analiz Sistemi</h1>
    
    <form action="/tahmin" method="POST">
        <label>Aylık Gelir:</label><br>
        <input type="number" step="0.01" name="gelir" required><br><br>
        
        <label>Toplam Borç:</label><br>
        <input type="number" step="0.01" name="borc" required><br><br>
        
        <label>Kredi Geçmişi (1: İyi, 0: Kötü):</label><br>
        <input type="number" name="kredi_gecmisi" min="0" max="1" required><br><br>
        
        <label>Yaş:</label><br>
        <input type="number" name="yas" required><br><br>
        
        <button type="submit">Risk Analizi Yap</button>
    </form>

    {% if sonuc %}
        <hr>
        <h2>Analiz Sonucu: <strong>{{ sonuc }}</strong></h2>
    {% endif %}
</body>
</html>
